[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "applysense-ai-backend"
version = "0.1.0"
description = "ApplySense AI MVP backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.32",
  "asyncpg>=0.29.0",
  "psycopg2-binary>=2.9.9",
  "alembic>=1.13.2",
  "pydantic>=2.8.2",
  "pydantic-settings>=2.4.0",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "bcrypt>=4.0,<4.1",
  "cryptography>=43.0.0",
  "celery[redis]>=5.4.0",
  "redis>=5.0.8",
  "httpx>=0.27.0",
  "jinja2>=3.1.4",
  "langgraph>=0.2.30",
  "langchain-core>=0.3.0",
  "numpy>=2.1.0",
  "email-validator>=2.2.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.6.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
